<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C18"/>
      <stop offset="50%" stop-color="#0A1124"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="32" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Core Gradients -->
    <linearGradient id="cyanSapphire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#06B6D4"/>
      <stop offset="85%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="emeraldCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="vortexRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)" rx="48"/>

  <!-- Tactical Vyuha Vortex Rings -->
  <g transform="translate(400, 360)">
    <!-- Outer Vortex Swirls -->
    <circle r="210" fill="none" stroke="url(#vortexRing)" stroke-width="8" stroke-dasharray="120 40 80 50" opacity="0.6" transform="rotate(-15)"/>
    <circle r="175" fill="none" stroke="url(#cyanSapphire)" stroke-width="12" stroke-dasharray="160 30 70 40" opacity="0.8" transform="rotate(45)"/>
    <circle r="140" fill="none" stroke="url(#emeraldCyan)" stroke-width="16" stroke-dasharray="200 40 50 30" opacity="0.9" transform="rotate(-60)"/>
    
    <!-- Luminous Ambient Halo -->
    <circle r="90" fill="#06B6D4" opacity="0.18" filter="url(#neonGlow)"/>

    <!-- Central Tactical 'X' Emblem -->
    <g filter="url(#neonGlow)">
      <!-- Arm 1: Top-Left to Bottom-Right -->
      <path d="M -130 -130 L -40 -130 L 0 -45 L 40 -130 L 130 -130 L 50 0 L 130 130 L 40 130 L 0 45 L -40 130 L -130 130 L -50 0 Z"
            fill="url(#cyanSapphire)"
            stroke="#67E8F9"
            stroke-width="4"
            stroke-linejoin="round"/>
      
      <!-- Inner Precision Facets -->
      <path d="M -90 -90 L 0 0 L 90 -90" fill="none" stroke="#E0F2FE" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
      <path d="M -90 90 L 0 0 L 90 90" fill="none" stroke="#A7F3D0" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
      
      <!-- Center Quantum Core Diamond -->
      <polygon points="0,-22 22,0 0,22 -22,0" fill="#ECFEFF" stroke="#38BDF8" stroke-width="3"/>
    </g>
  </g>

  <!-- Brand Typography: VYUHOX -->
  <text x="400" y="660" 
        font-family="'Inter', 'Outfit', system-ui, -apple-system, sans-serif" 
        font-size="64" 
        font-weight="900" 
        letter-spacing="14" 
        text-anchor="middle" 
        fill="#38BDF8"
        filter="url(#neonGlow)">
    VYUHOX
  </text>
  <text x="400" y="700" 
        font-family="'Inter', system-ui, sans-serif" 
        font-size="14" 
        font-weight="700" 
        letter-spacing="8" 
        text-anchor="middle" 
        fill="#94A3B8" 
        opacity="0.8">
    AUTONOMOUS GTM PLATFORM
  </text>
</svg>
